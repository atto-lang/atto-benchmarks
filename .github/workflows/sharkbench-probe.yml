name: SharkBench probe self-tests (host-only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head and tree
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree}
      - name: Verify Python correctness probe controls (not guest execution)
        working-directory: benchmark/web/sharkbench
        run: |
          python3 -B -m unittest -v test_probe test_lifecycle
          python3 -m py_compile adapters/jvm/transport_probe.py
          bash -n adapters/jvm/run-transport.sh
          (cd adapters/jvm && python3 -m unittest -v test_transport)
